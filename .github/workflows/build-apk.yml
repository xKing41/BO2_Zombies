name: APK bauen

# Baut die Android-App in der Cloud – wie bei der Motorrad-App: Das Spiel
# wird gebaut, in die Android-Hülle (android/) gelegt und als fest signierte
# APK bereitgestellt.
# Direkter Download (immer die neueste APK, ohne Anmeldung und ohne ZIP):
#   https://github.com/xKing41/BO2_Zombies/releases/latest/download/Nachtfall.apk
# Außerdem: Actions → letzter Lauf → Artifacts → "Nachtfall-APK" (als ZIP).

on:
  # Von Hand startbar (auch vom Handy aus, im Reiter "Actions").
  workflow_dispatch:
  # Und automatisch bei jeder Änderung – auch auf Arbeitszweigen.
  push:
    branches: [main, master, 'claude/**', 'ccr-**']

# Kommt ein neuer Push, während noch gebaut wird: alten Lauf abbrechen.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Zum Aktualisieren der Download-Release
    permissions:
      contents: write

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Spiel bauen
        run: |
          npm ci
          npm run build

      - name: Spiel in die App legen
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/. android/app/src/main/assets/www/
          # Den Offline-Cache des Browsers braucht die App nicht
          rm -f android/app/src/main/assets/www/sw.js
          du -sh android/app/src/main/assets/www

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/Nachtfall.apk
          ls -la ../out

      - name: Signatur anzeigen
        run: |
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$SIGNER" verify --print-certs out/Nachtfall.apk | grep -i "SHA-256" || true
          echo "Erwartet (fester Schlüssel): 75a3f6070f9898792e0f0a21e2b5959ba67df91f450783971dd7ba574a640ecd"

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Nachtfall-APK
          path: out/Nachtfall.apk
          if-no-files-found: error
          retention-days: 30

      # Fester Download-Link: Die APK hängt an der Release „apk-latest“ und
      # wird bei jedem Bau ersetzt – der Link oben bleibt dadurch immer gleich.
      - name: Direkt-Download aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=apk-latest
          TITLE="Nachtfall – neueste APK"
          NOTES="Neueste Nachtfall-APK, automatisch gebaut aus ${GITHUB_REF_NAME} (${GITHUB_SHA::7}) am $(date -u '+%d.%m.%Y um %H:%M') UTC. Nachtfall.apk herunterladen, antippen, installieren – neue Versionen lassen sich über die alte installieren."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" out/Nachtfall.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/Nachtfall.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest --repo "$GITHUB_REPOSITORY"
          fi
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Nachtfall.apk"
